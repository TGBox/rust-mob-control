[package]
name = "rust-mob-control"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15"
rand = "0.8"

# Keep debug = 0 to prevent 4GB+ PDB files on Windows MSVC, save disk space, and link fast
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
